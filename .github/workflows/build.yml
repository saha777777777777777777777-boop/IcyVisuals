name: release
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: unzip -o icevisuals-source.zip
      - run: gradle build
        working-directory: icevisuals
      - run: gh release create "v${{ github.run_number }}" icevisuals/build/libs/icevisuals-1.0.0.jar --title "Ice Visuals ${{ github.run_number }}" --notes "Fabric 1.21.11"
        env:
          GH_TOKEN: ${{ github.token }}
